        <div class="sheet-footer"><a class="listen-link" href="${e.link}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7Z"></path></svg> 在小宇宙收听这一期</a><div class="source-note">逐字稿为本地 Paraformer 转写，可能存在个别错字；高亮取自逐字稿原句，匹配不到的引文不会伪造划线。精读与模块分析基于逐字稿和官方 Shownotes 整理，引用请以音频为准。</div></div>
      </div>
    </div>
  </div>`;

  $('#volDoneBtn').addEventListener('click', ()=>{ toggleDone(e.n); syncVolActions(e.n); });
  $('#volSaveBtn').addEventListener('click', ()=>{ toggleSaved(e.n); syncVolActions(e.n); });
  const ta = $('#volNote');
  let timer;
  ta.addEventListener('input', ()=>{
    state.notes[e.n] = ta.value;
    $('#volNoteStatus').textContent = '保存中…';
    clearTimeout(timer);
    timer = setTimeout(()=>{ saveState(); $('#volNoteStatus').textContent='已自动保存'; }, 350);
  });

  const trSections = $$('#trSections .tr-sec');
  const defaultOpen = transcript.sections.map(s=>!!s.open);
  const trSearch = $('#trSearch');
  const trSearchWrap = $('#trSearchWrap');
  const trSearchCount = $('#trSearchCount');
  const restoreTranscript = ()=>{
    trSections.forEach((sec,i)=>{
      sec.hidden = false;
      sec.open = defaultOpen[i];
      sec.querySelectorAll('.tr-chunk').forEach(ch=>{ ch.hidden = false; });
    });
    if (trSearchCount) trSearchCount.textContent = '';
  };
  $('#trSearchToggle')?.addEventListener('click', ()=>{
    if (!trSearchWrap) return;
    if (trSearchWrap.hasAttribute('hidden')){
      trSearchWrap.removeAttribute('hidden');
      trSearch?.focus();
    } else {
      trSearchWrap.setAttribute('hidden','');
      if (trSearch) trSearch.value = '';
      restoreTranscript();
    }
  });
  if (trSearch) {
    trSearch.addEventListener('input', ()=>{
      const q = trSearch.value.trim().toLowerCase();
      if (!q) { restoreTranscript(); return; }
      let hits = 0;
      trSections.forEach(sec=>{
        let hitSec = false;
        sec.querySelectorAll('.tr-chunk').forEach(ch=>{
          const hit = (ch.dataset.text || '').toLowerCase().includes(q);
          ch.hidden = !hit;
          if (hit){ hits++; hitSec = true; }
        });
        sec.hidden = !hitSec;
        sec.open = hitSec;
      });
      if (trSearchCount) trSearchCount.textContent = `${hits} 段命中`;
    });
  }
  $('#trExpandAll')?.addEventListener('click', ()=>{
    trSections.forEach(sec=>{ if (!sec.hidden) sec.open = true; });
  });
  $('#trCollapseAll')?.addEventListener('click', ()=>{
    trSections.forEach(sec=>{ sec.open = false; });
  });
  const copyBtn = $('#copyTranscript');
  if (copyBtn) {
    copyBtn.addEventListener('click', async ()=>{
      const text = chunks.map(c=>c[1]).join('\n');
      try {
        await navigator.clipboard.writeText(text);
        toast('逐字稿已复制');
      } catch(err) {
        const t = document.createElement('textarea');
        t.value = text; document.body.appendChild(t); t.select();
        try { document.execCommand('copy'); toast('逐字稿已复制'); } catch(e2) { toast('复制失败，请手动选择'); }
        t.remove();
      }
    });
  }

  const vaTabs = $$('#vaTabs [data-va-tab]');
  const vaPanels = $$('#view-vol [data-va-panel]');
  vaTabs.forEach(tab=>{
    tab.addEventListener('click', ()=>{
      const active = tab.dataset.vaTab;
      vaTabs.forEach(t=>{
        const on = t===tab;
        t.classList.toggle('active', on);
        t.setAttribute('aria-selected', on ? 'true' : 'false');
      });
      vaPanels.forEach(p=>{ p.hidden = p.dataset.vaPanel !== active; });
    });
  });

  const dlgCard = $('#dlGrow');
  const placeDongliao = ()=>{
    if (!dlgCard) return;
    const desktop = window.matchMedia('(min-width:960px)').matches;
    const slot = desktop
      ? document.querySelector('.vol-rail [data-dl-slot="desktop"]')
      : document.querySelector('[data-dl-slot="mobile"]');
    if (slot) slot.appendChild(dlgCard);
  };
  if (dlgCard) {
    const dlgNext = $('#dlgNext');
    const dlgStages = [...dlgCard.querySelectorAll('[data-dlg-stage]')];
    const dlgDots = [...dlgCard.querySelectorAll('.dlg-progress i')];
    const labels = ['把这句话放回上下文','再往下想一层','最后，点睛','收起，重新读'];
    const setDlgStage = (stage, scroll=true)=>{
      dlgCard.dataset.stage = stage;
      dlgStages.forEach(el=>{ el.hidden = Number(el.dataset.dlgStage) > stage; });
      dlgDots.forEach((dot,i)=>dot.classList.toggle('on', i <= stage));
      dlgCard.classList.toggle('is-complete', stage === 3);
      dlgNext.setAttribute('aria-expanded', stage ? 'true' : 'false');
      dlgNext.innerHTML = `${labels[stage]} <span>${stage===3?'↺':'→'}</span>`;
      if (!scroll) return;
      if (stage === 0) { dlgCard.scrollIntoView({behavior:'smooth',block:'center'}); return; }
      const target = dlgStages.find(el=>Number(el.dataset.dlgStage)===stage);
      if (target) setTimeout(()=>target.scrollIntoView({behavior:'smooth',block:'center'}), 80);
    };
    dlgNext.addEventListener('click', ()=>{
      const cur = Number(dlgCard.dataset.stage) || 0;
      setDlgStage(cur >= 3 ? 0 : cur + 1);
    });
    const jumpToDongliao = ()=>{
      if (trSearch && trSearch.value) {
        trSearch.value = '';
        restoreTranscript();
      }
      if (transcript.dlSection >= 0){
        const sec = document.getElementById('tr-sec-' + transcript.dlSection);
        if (sec) sec.open = true;
      }
      const desktop = window.matchMedia('(min-width:960px)').matches;
      const target = desktop ? document.getElementById('tr-chunk-' + transcript.dlIdx) : dlgCard;
      if (target) setTimeout(()=>target.scrollIntoView({behavior:'smooth',block:'center'}), 80);
      if (desktop){
        dlgCard.classList.add('flash');
        setTimeout(()=>dlgCard.classList.remove('flash'), 1200);
      }
    };
    $$('#view-vol [data-dl-jump]').forEach(b=>b.addEventListener('click', jumpToDongliao));
    placeDongliao();
    const volMq = window.matchMedia('(min-width:960px)');
    const onVolMq = ()=>placeDongliao();
    if (volMq.addEventListener) volMq.addEventListener('change', onVolMq);
    else if (volMq.addListener) volMq.addListener(onVolMq);
    volMediaCleanup = ()=>{
      if (volMq.removeEventListener) volMq.removeEventListener('change', onVolMq);
      else if (volMq.removeListener) volMq.removeListener(onVolMq);
    };
  }

  applyHighlights($('#view-vol'));
  window.scrollTo({top:0,behavior:'auto'});
}

function syncVolActions(n){

function openVol(n){

/* ---------- routing ---------- */
function showView(name){
  $$('.view').forEach(v=>v.classList.remove('active'));
  const v = $('#view-'+name); if(v) v.classList.add('active');
  const navName = name==='module' ? 'modules' : (name==='vol' ? 'episodes' : name);
  $$('.nav-item').forEach(b=>b.classList.toggle('active', b.dataset.nav===navName));
  window.scrollTo({top:0,behavior:'auto'});
}
function route(){
  const h = location.hash.replace(/^#\/?/,'') || 'home';
  const [seg, id] = h.split('/');
  if (seg==='home' || seg===''){ renderHome(); showView('home'); }
  else if (seg==='modules'){ renderModules(); showView('modules'); }
  else if (seg==='module'){ renderModule(id); showView('module'); }
  else if (seg==='episodes'){ renderEpisodes(); showView('episodes'); }
  else if (seg==='vol'){ renderVol(+id); showView('vol'); }
  else if (seg==='me'){ renderMe(); showView('me'); }
  else if (seg==='episode'){ openVol(+id); }
  else { renderHome(); showView('home'); }
  requestAnimationFrame(()=>{ const active = $('.view.active'); if(active) active.classList.add('active'); });
}
function go(target){ location.hash = '#/'+target; }

function renderAll(){
  renderHome();
  renderModules();
  renderMe();
  if (location.hash.startsWith('#/episodes')) renderEpisodes();
  route();
}

/* ---------- global events ---------- */
document.addEventListener('click', e=>{
  const scrollBtn = e.target.closest('[data-scroll]');
  if (scrollBtn){ document.getElementById(scrollBtn.dataset.scroll)?.scrollIntoView({behavior:'smooth'}); return; }
  const sceneJump = e.target.closest('[data-scene-jump]');
  if (sceneJump){
    const target = document.getElementById('mp-scene-' + sceneJump.dataset.sceneJump);
    target?.scrollIntoView({behavior:'smooth', block:'start'});
    $$('.mp-thread-step').forEach(b=>{
      const on = b===sceneJump;
      b.classList.toggle('active', on);
      b.setAttribute('aria-current', on ? 'true' : 'false');
    });
    return;
  }
  const takeBtn = e.target.closest('[data-take]');
  if (takeBtn){
    const key = takeBtn.dataset.take;
    state.takes[key] = !state.takes[key];
    saveState();
    const item = takeBtn.closest('.take-item');
    item?.classList.toggle('done', !!state.takes[key]);
    takeBtn.setAttribute('aria-pressed', state.takes[key] ? 'true' : 'false');
    return;
  }
  const filterBtn = e.target.closest('[data-epfilter]');
  if (filterBtn){
    epFilter = filterBtn.dataset.epfilter;
    if (location.hash === '#/episodes'){ renderEpisodes(); } else { location.hash = '#/episodes'; }
    return;
  }
  const goBtn = e.target.closest('[data-go]');
  if (goBtn){ go(goBtn.dataset.go); return; }
  const modBtn = e.target.closest('[data-module]');
  if (modBtn){ location.hash = '#/module/'+modBtn.dataset.module; return; }
  const epBtn = e.target.closest('[data-ep]');
  if (epBtn){ openVol(+epBtn.dataset.ep); return; }
  const nav = e.target.closest('.nav-item');
  if (nav){ go(nav.dataset.nav); return; }
});
$('#closeSheet').addEventListener('click', ()=>closeSheet(false));
$('#episodeSheet').addEventListener('click', e=>{ if(e.target === $('#episodeSheet')) closeSheet(false); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && $('#episodeSheet').classList.contains('open')) closeSheet(false); });
window.addEventListener('popstate', ()=>{
  if ($('#episodeSheet').classList.contains('open')) closeSheet(true);
  route();
});
window.addEventListener('hashchange', ()=>{
  if ($('#episodeSheet').classList.contains('open')) closeSheet(true);
  route();
});
window.addEventListener('scroll', ()=>{
  $('#appHeader').classList.toggle('scrolled', window.scrollY>4);
  scheduleModuleSceneNav();
}, {passive:true});
$('#searchJump').addEventListener('click', ()=>{ go('episodes'); setTimeout(()=>$('#epSearch')?.focus(), 120); });
$('#themeToggle').addEventListener('click', ()=>{
  const cur = document.documentElement.dataset.theme || 'light';
  const next = cur==='dark'?'light':'dark';
  document.documentElement.dataset.theme = next;
  state.theme = next; saveState();
  toast(next==='dark'?'已切换到深色':'已切换到浅色');
});

/* init */
renderHome();
renderModules();
renderMe();
route();
</script>
</body>
</html>
