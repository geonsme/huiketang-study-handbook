<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3eee5">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#09090b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2720%27 fill=%27%23f5a623%27/%3E%3Ctext x=%2750%27 y=%2770%27 font-size=%2760%27 text-anchor=%27middle%27 fill=%27%23171512%27%3E%E6%85%A7%3C/text%3E%3C/svg%3E">
<title>慧客堂 · 学习手册｜老听众整理 · 章节导读与 Vol 深读</title>
<meta name="description" content="慧客堂 __EP_COUNT__ 期播客学习手册（老听众整理）：8 篇章节大导读、__EP_COUNT__ 期 Vol 导读、__EP_COUNT__ 条董了观点、逐字稿原文摘录、__CORE_COUNT__ 期核心精读、8 大模块。">
<style>
:root{
  --paper:#fbf3e3;
  --paper-2:#f5e5c6;
  --card:#fff9ec;
  --ink:#171512;
  --ink-2:#3b3226;
  --muted:#786b58;
  --line:rgba(23,21,18,.15);
  --line-strong:rgba(23,21,18,.3);
  --orange:#f5a623;
  --orange-2:#e18f0b;
  --red:#a95a05;
  --red-2:#d9860b;
  --teal:#2b241b;
  --gold:#8a5a1c;
  --shadow:0 18px 44px rgba(80,50,5,.12);
  --shadow-sm:0 7px 20px rgba(80,50,5,.08);
  --radius:18px;
  --serif:"Songti SC","Noto Serif SC","STSong","SimSun",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --mono:"SFMono-Regular","Cascadia Mono","Consolas",monospace;
  --nav-h:72px;
}
@media (prefers-color-scheme: dark){
  :root{
  --paper:#15120d; --paper-2:#211a10; --card:#201a12; --ink:#fbf1dd; --ink-2:#e7d9c1;
  --muted:#b4a58b; --line:rgba(251,241,221,.16); --line-strong:rgba(251,241,221,.3);
  --orange:#f5a623; --orange-2:#ffc14d; --red:#ffb02e; --red-2:#ffc45c; --teal:#f2e5cc; --gold:#d9a441;
  --shadow:0 18px 44px rgba(0,0,0,.32); --shadow-sm:0 7px 20px rgba(0,0,0,.22);
  }
}
html[data-theme="light"]{
  --paper:#fbf3e3;
  --paper-2:#f5e5c6;
  --card:#fff9ec;
  --ink:#171512;
  --ink-2:#3b3226;
  --muted:#786b58;
  --line:rgba(23,21,18,.15);
  --line-strong:rgba(23,21,18,.3);
  --orange:#f5a623;
  --orange-2:#e18f0b;
  --red:#a95a05;
  --red-2:#d9860b;
  --teal:#2b241b;
  --gold:#8a5a1c;
  --shadow:0 18px 44px rgba(80,50,5,.12);
  --shadow-sm:0 7px 20px rgba(80,50,5,.08);
  --radius:18px;
  --serif:"Songti SC","Noto Serif SC","STSong","SimSun",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --mono:"SFMono-Regular","Cascadia Mono","Consolas",monospace;
  --nav-h:72px;
}
html[data-theme="dark"]{
  --paper:#15120d; --paper-2:#211a10; --card:#201a12; --ink:#fbf1dd; --ink-2:#e7d9c1;
  --muted:#b4a58b; --line:rgba(251,241,221,.16); --line-strong:rgba(251,241,221,.3);
  --orange:#f5a623; --orange-2:#ffc14d; --red:#ffb02e; --red-2:#ffc45c; --teal:#f2e5cc; --gold:#d9a441;
  --shadow:0 18px 44px rgba(0,0,0,.32); --shadow-sm:0 7px 20px rgba(0,0,0,.22);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.72;letter-spacing:.01em;
  background-image:
    radial-gradient(900px 420px at 110% -8%, rgba(245,166,35,.15), transparent 60%),
    radial-gradient(700px 380px at -10% 8%, rgba(169,90,5,.06), transparent 60%),
    repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(23,21,18,.012) 3px, rgba(23,21,18,.012) 4px);
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);
}
body.sheet-open{overflow:hidden}
::selection{background:rgba(245,166,35,.35)}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
img{max-width:100%;display:block}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;letter-spacing:.01em;margin:0}
p{margin:0 0 1em}
p:last-child{margin-bottom:0}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.small{font-size:12.5px;line-height:1.6}
.tiny{font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.serif{font-family:var(--serif)}
.accent{color:var(--red)}

/* header */
.app-header{
  position:sticky;top:0;z-index:50;
  background:var(--paper);
  background:color-mix(in srgb, var(--paper) 84%, transparent);
  backdrop-filter:saturate(1.2) blur(18px);-webkit-backdrop-filter:saturate(1.2) blur(18px);
  border-bottom:1px solid transparent;transition:border-color .25s,box-shadow .25s;
}
.app-header.scrolled{border-bottom-color:var(--line);box-shadow:0 8px 30px rgba(40,30,15,.05)}
.header-inner{max-width:760px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none}
.seal{
  width:32px;height:32px;border-radius:8px;background:var(--red);color:#fff8eb;
  display:grid;place-items:center;font-family:var(--serif);font-size:19px;line-height:1;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);flex:none;
}
.brand-text{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand-text strong{font-family:var(--serif);font-size:16px;font-weight:600;letter-spacing:.08em}
.brand-text span{font-size:9.5px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
.header-actions{margin-left:auto;display:flex;gap:4px}
.icon-btn{
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  color:var(--ink-2);transition:background .2s,color .2s;
}
.icon-btn:hover,.icon-btn:focus-visible{background:var(--paper-2);color:var(--red)}
.icon-btn.on{color:var(--red);background:rgba(163,58,47,.08)}
.icon-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* views */
.view{display:none}
.view.active{display:block;animation:rise .32s ease both}
@keyframes rise{from{opacity:.65;transform:translateY(6px)}to{opacity:1;transform:none}}

/* hero */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line);padding:30px 0 26px}
.hero::after{
  content:"";position:absolute;inset:auto -20% -55% 35%;height:340px;border-radius:50%;
  background:radial-gradient(closest-side, rgba(163,58,47,.14), transparent 70%);pointer-events:none;
}
.hero-cover{
  position:absolute;right:-38px;top:-6px;width:190px;height:190px;object-fit:cover;
  border-radius:50%;opacity:.16;filter:saturate(.75) contrast(.9);pointer-events:none;
  mask-image:radial-gradient(circle at 50% 50%, #000 30%, transparent 70%);
  -webkit-mask-image:radial-gradient(circle at 50% 50%, #000 30%, transparent 70%);
}
.hero-inner{position:relative;z-index:1}
.eyebrow{display:flex;align-items:center;gap:8px;color:var(--red);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;margin-bottom:14px}
.eyebrow::before{content:"";width:22px;height:1px;background:var(--red);display:block}
.hero h1{font-size:clamp(34px,9.2vw,50px);line-height:1.16;letter-spacing:.01em;max-width:11em}
.hero h1 em{font-style:normal;color:var(--red);position:relative;white-space:nowrap}
.hero h1 em::after{content:"";position:absolute;left:0;right:0;bottom:.08em;height:.18em;background:rgba(163,58,47,.18);z-index:-1}
.hero-lead{margin-top:16px;color:var(--ink-2);font-size:14.5px;max-width:34em}
.hero-lead strong{font-weight:600;color:var(--ink)}
.hero-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:24px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.hero-stat{padding:14px 8px 13px 0;border-right:1px solid var(--line)}
.hero-stat:last-child{border-right:0;padding-left:12px}
.hero-stat b{display:block;font-family:var(--serif);font-size:22px;font-weight:600;line-height:1;letter-spacing:-.02em}
.hero-stat span{display:block;color:var(--muted);font-size:10.5px;margin-top:7px;letter-spacing:.06em}
.hero-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:600;line-height:1;
  border:1px solid var(--line-strong);transition:transform .18s,background .2s,border-color .2s;
}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn-primary:hover{background:var(--red);border-color:var(--red)}
.btn-ghost:hover{border-color:var(--red);color:var(--red)}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* sections */
.section{padding:30px 0 4px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px}
.section-head .kicker{color:var(--red);font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;margin-bottom:8px}
.section-head h2{font-size:25px;line-height:1.25}
.section-head .sub{color:var(--muted);font-size:12.5px;margin-top:5px}
.link-more{color:var(--red);font-size:12px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;text-decoration:none;padding-bottom:3px}
.link-more svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8}

/* host card */
.host-card{
  position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px;box-shadow:var(--shadow-sm);overflow:hidden;
}
.host-card::before{content:"慧";position:absolute;right:10px;bottom:-26px;font-family:var(--serif);font-size:120px;color:rgba(163,58,47,.055);line-height:1}
.host-top{display:flex;gap:14px;align-items:flex-start}
.host-avatar{width:54px;height:54px;border-radius:50%;object-fit:cover;border:1px solid var(--line);flex:none;background:var(--paper-2)}
.host-name{font-family:var(--serif);font-size:19px;line-height:1.2}
.host-role{color:var(--muted);font-size:11.5px;margin-top:4px}
.host-bio{color:var(--ink-2);font-size:13px;margin-top:13px;position:relative;z-index:1}
.host-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;position:relative;z-index:1}
.pill{display:inline-flex;align-items:center;padding:4px 9px;border-radius:999px;background:rgba(47,93,86,.08);color:var(--teal);font-size:10.5px;letter-spacing:.03em;white-space:nowrap}
html[data-theme="dark"] .pill{background:rgba(141,185,174,.12)}
.pill.red{background:rgba(163,58,47,.09);color:var(--red)}
.pill.gold{background:rgba(169,130,73,.12);color:var(--gold)}

/* principles */
.principles{border-top:1px solid var(--line)}
.principle{
  display:grid;grid-template-columns:42px 1fr;gap:12px;padding:15px 0;border-bottom:1px solid var(--line);
  cursor:pointer;transition:background .2s;
}
.principle:hover{background:color-mix(in srgb,var(--card) 70%,transparent)}
.principle .no{font-family:var(--serif);color:var(--red);font-size:15px;padding-top:2px}
.principle h3{font-size:16.5px;line-height:1.35}
.principle p{color:var(--muted);font-size:12.5px;margin-top:4px;line-height:1.65}
.principle .refs{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.ref-chip{font-size:10px;color:var(--red);border:1px solid rgba(163,58,47,.22);border-radius:999px;padding:2px 7px;background:transparent}
.ref-chip:hover{background:rgba(163,58,47,.07)}

/* howto */
.howto{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.howto-card{border:1px solid var(--line);border-radius:14px;padding:13px;background:var(--card)}
.howto-card b{font-family:var(--serif);font-size:12px;color:var(--red);font-weight:600}
.howto-card h3{font-size:14px;margin-top:6px;line-height:1.35}
.howto-card p{font-size:10.5px;color:var(--muted);line-height:1.65;margin-top:5px}
@media (max-width:380px){.howto{grid-template-columns:1fr}.howto-card{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start}.howto-card b{grid-row:span 2}.howto-card h3{margin-top:0}.howto-card p{grid-column:2}}

/* path */
.path-scroll{display:flex;gap:12px;overflow-x:auto;padding:2px 0 8px;scroll-snap-type:x mandatory;scrollbar-width:none}
.path-scroll::-webkit-scrollbar{display:none}
.path-card{
  flex:0 0 255px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);padding:17px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;
}
.path-card .stage{font-size:10px;letter-spacing:.16em;color:var(--red);font-weight:700}
.path-card h3{font-size:18px;margin-top:6px;line-height:1.3}
.path-card .time{font-size:10.5px;color:var(--muted);margin-top:3px}
.path-card p{font-size:12px;color:var(--muted);margin-top:9px;line-height:1.65}
.path-card .eps{display:flex;gap:5px;flex-wrap:wrap;margin-top:11px}
.path-card .ep-dot{font-size:9.5px;border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--ink-2)}
.path-card::after{content:"";position:absolute;right:-22px;top:-22px;width:70px;height:70px;border-radius:50%;background:rgba(163,58,47,.06)}
.phase-card{flex-basis:232px}
.phase-card .stage{letter-spacing:.08em;font-size:9.5px}
.phase-card h3{font-size:22px}

/* module grid */
.module-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.module-card{
  position:relative;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);padding:15px 14px 14px;min-height:148px;box-shadow:var(--shadow-sm);
  display:flex;flex-direction:column;transition:transform .2s,border-color .2s,box-shadow .2s;overflow:hidden;
}
.module-card:hover{transform:translateY(-2px);border-color:var(--line-strong);box-shadow:var(--shadow)}
.module-card .mno{font-family:var(--serif);font-size:11px;color:var(--red);letter-spacing:.1em}
.module-card h3{font-size:16.5px;line-height:1.3;margin-top:9px;max-width:9.5em}
.module-card .msub{font-size:10.5px;color:var(--muted);margin-top:5px;line-height:1.5}
.module-card .mcount{margin-top:auto;padding-top:10px;font-size:10px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.module-card .mcount svg{width:13px;height:13px;stroke:var(--red);fill:none;stroke-width:1.8}
.module-card::before{content:"";position:absolute;right:-26px;bottom:-30px;width:88px;height:88px;border-radius:50%;border:1px solid rgba(163,58,47,.12)}

/* episode rows */
.ep-list{display:flex;flex-direction:column;gap:8px}
.ep-row{
  width:100%;text-align:left;display:grid;grid-template-columns:58px 1fr;gap:12px;
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 13px;
  transition:border-color .2s,transform .18s,box-shadow .2s;position:relative;
}
.ep-row:hover{border-color:var(--line-strong);box-shadow:var(--shadow-sm)}
.ep-row:active{transform:scale(.995)}
.ep-row .ep-label{font-family:var(--mono);font-size:10.5px;color:var(--red);letter-spacing:-.02em;padding-top:2px}
.ep-row .ep-date{font-size:9.5px;color:var(--muted);margin-top:4px;line-height:1.5}
.ep-row h3{font-size:14.5px;line-height:1.45;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ep-row .ep-line{color:var(--muted);font-size:11.5px;margin-top:5px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ep-row .ep-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;align-items:center}
.ep-row .mini-tag{font-size:9.5px;color:var(--muted);background:var(--paper-2);border-radius:4px;padding:2px 6px}
.ep-row .core-tag{font-size:9px;color:#fff8eb;background:var(--red);border-radius:4px;padding:2px 5px;letter-spacing:.04em}
.ep-row .done-dot{position:absolute;right:10px;top:10px;width:7px;height:7px;border-radius:50%;background:var(--teal);display:none}
.ep-row.is-done .done-dot{display:block}
.ep-row.is-done{background:color-mix(in srgb,var(--teal) 5%,var(--card))}

/* books */
.book-scroll{display:flex;gap:9px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.book-scroll::-webkit-scrollbar{display:none}
.book-card{flex:0 0 175px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card)}
.book-card .bt{font-family:var(--serif);font-size:13.5px;line-height:1.4}
.book-card .bn{font-size:10.5px;color:var(--muted);margin-top:5px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.book-card .be{font-size:9.5px;color:var(--red);margin-top:8px}

/* search / filters */
.search-wrap{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:2px 0 12px}
.search-wrap svg{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:1.8;flex:none}
.search-wrap input{flex:1;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:13.5px;min-width:0;-webkit-appearance:none;appearance:none}
.search-wrap input::-webkit-search-cancel-button,.search-wrap input::-webkit-search-decoration{display:none;-webkit-appearance:none}
.search-wrap input::placeholder{color:var(--muted)}
.search-clear{width:22px;height:22px;border-radius:50%;display:none;place-items:center;background:var(--paper-2);color:var(--muted);font-size:13px}
.search-clear.show{display:grid}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:11px;color:var(--muted);background:transparent;white-space:nowrap;transition:all .18s}
.chip:hover{border-color:var(--line-strong);color:var(--ink)}
.chip.active{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.filter-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 12px}
.filter-count{font-size:11px;color:var(--muted)}
.sort-btn{font-size:11px;color:var(--red);display:flex;align-items:center;gap:4px}
.sort-btn svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.8}
.empty{padding:50px 20px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:var(--radius);margin:10px 0}

/* module detail */
.detail-top{display:flex;align-items:center;gap:10px;padding:14px 0 4px}
.back-btn{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);padding:6px 0}
.back-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
.module-hero{padding:16px 0 22px;border-bottom:1px solid var(--line)}
.module-hero .mno{font-family:var(--serif);font-size:13px;color:var(--red);letter-spacing:.12em}
.module-hero h1{font-size:clamp(29px,7.5vw,42px);line-height:1.2;margin-top:8px}
.module-hero .msub{color:var(--muted);font-size:14px;margin-top:6px}
.module-hero .lead{font-size:15px;color:var(--ink-2);margin-top:18px;line-height:1.8}
.big-idea{margin-top:18px;border-left:3px solid var(--red);padding:11px 0 11px 14px;font-family:var(--serif);font-size:17px;line-height:1.55;color:var(--ink)}
.quote-card{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;position:relative}
.quote-card .q{font-family:var(--serif);font-size:17px;line-height:1.6}
.quote-card .src{font-size:10.5px;color:var(--muted);margin-top:8px;letter-spacing:.06em}
.module-body{padding-top:8px}
.module-section{padding:20px 0;border-bottom:1px solid var(--line)}
.module-section h2{font-size:20px;line-height:1.35;margin-bottom:10px}
.module-section p{font-size:14px;color:var(--ink-2);line-height:1.85}
.case-grid{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.case-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.case-card h3{font-size:14.5px;line-height:1.4}
.case-card p{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.7}
.case-card .case-ep{font-size:10px;color:var(--red);margin-top:8px}
.action-list{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:9px}
.action-list li{display:grid;grid-template-columns:18px 1fr;gap:9px;font-size:13px;color:var(--ink-2);line-height:1.65}
.action-list .box{width:16px;height:16px;border:1px solid var(--line-strong);border-radius:4px;margin-top:3px}
.related-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.next-module{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 8px;padding:16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card)}
.next-module .nm-k{font-size:10px;color:var(--muted);letter-spacing:.12em}
.next-module .nm-t{font-family:var(--serif);font-size:17px;margin-top:3px}
.next-module svg{width:20px;height:20px;stroke:var(--red);fill:none;stroke-width:1.8;flex:none}

/* me */
.profile-head{padding:22px 0 18px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:center}
.ring-wrap{position:relative;width:86px;height:86px;flex:none}
.ring-wrap svg{width:86px;height:86px;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--line);stroke-width:5}
.ring-fg{fill:none;stroke:var(--red);stroke-width:5;stroke-linecap:round;transition:stroke-dasharray .5s ease}
.ring-text{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring-text b{font-family:var(--serif);font-size:20px;font-weight:600}
.ring-text span{font-size:9px;color:var(--muted);display:block;margin-top:2px}
.profile-head h1{font-size:23px}
.profile-head p{font-size:12px;color:var(--muted);margin-top:4px}
.me-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.me-stat{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card)}
.me-stat b{font-family:var(--serif);font-size:20px;display:block;line-height:1}
.me-stat span{font-size:10px;color:var(--muted);display:block;margin-top:5px}
.me-section{margin-top:22px}
.me-section h2{font-size:18px;margin-bottom:10px}
.note-item{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card);margin-bottom:7px}
.note-item .nt{font-size:12.5px;font-weight:600;line-height:1.45}
.note-item .nn{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.note-item .ne{font-size:9.5px;color:var(--red);margin-top:7px}
.empty-mini{font-size:12px;color:var(--muted);padding:14px;border:1px dashed var(--line);border-radius:12px;text-align:center}
.about-card{border:1px solid var(--line);border-radius:var(--radius);padding:16px;background:var(--card);font-size:12px;color:var(--muted);line-height:1.8}
.about-card strong{color:var(--ink)}
.actions-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.danger{color:var(--red);border-color:rgba(163,58,47,.3)}
details.glossary{border-top:1px solid var(--line)}
details.glossary summary{list-style:none;cursor:pointer;padding:12px 0;display:flex;align-items:center;justify-content:space-between;font-size:13px}
details.glossary summary::-webkit-details-marker{display:none}
details.glossary summary::after{content:"+";font-size:16px;color:var(--red)}
details.glossary[open] summary::after{content:"–"}
.gloss-item{padding:0 0 11px;font-size:12px;color:var(--muted);line-height:1.7}
.gloss-item b{color:var(--ink);font-family:var(--mono);font-size:11.5px;font-weight:600;margin-right:5px}

/* sheet */
.sheet{
  position:fixed;inset:0;z-index:100;background:var(--paper);overflow-y:auto;overscroll-behavior:contain;
  transform:translateY(100%);transition:transform .34s cubic-bezier(.2,.75,.25,1);visibility:hidden;
}
.sheet.open{transform:none;visibility:visible}
.sheet-header{
  position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;
  padding:12px 16px;background:var(--paper);
  background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);
}
.sheet-header .sh-label{font-family:var(--mono);font-size:10.5px;color:var(--red);letter-spacing:.02em}
.sheet-header .sh-actions{margin-left:auto;display:flex;gap:2px}
.sheet-content{max-width:720px;margin:0 auto;padding:20px 18px 60px}
.sheet-kicker{font-size:10px;letter-spacing:.16em;color:var(--red);text-transform:uppercase;font-weight:700}
.sheet-title{font-size:clamp(25px,6.5vw,34px);line-height:1.28;margin-top:8px}
.sheet-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;font-size:10.5px;color:var(--muted)}
.sheet-line{font-size:14px;color:var(--ink-2);line-height:1.8;margin-top:16px;padding-left:13px;border-left:2px solid var(--red)}
.ep-note{margin-top:14px;padding:10px 12px;border-radius:10px;background:rgba(169,130,73,.09);border:1px solid rgba(169,130,73,.2);color:var(--ink-2);font-size:11.5px;line-height:1.7}
.sheet-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.sheet-toolbar{display:flex;gap:8px;margin-top:18px}
.tool-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-size:11.5px;color:var(--muted);background:var(--card);transition:all .18s}
.tool-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tool-btn.on{color:var(--red);border-color:rgba(163,58,47,.35);background:rgba(163,58,47,.06)}
.sheet-section{margin-top:26px;padding-top:20px;border-top:1px solid var(--line)}
.sheet-section h2{font-size:19px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sheet-section h2 .idx{font-family:var(--mono);font-size:10px;color:var(--red);font-weight:400}
.points{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px}
.points li{display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:13.5px;line-height:1.75;color:var(--ink-2)}
.points .pno{font-family:var(--serif);color:var(--red);font-size:13px;padding-top:1px}
.chapter-list{display:flex;flex-direction:column}
.chapter{display:grid;grid-template-columns:56px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px;line-height:1.6}
.chapter:last-child{border-bottom:0}
.chapter .ct{font-family:var(--mono);font-size:10.5px;color:var(--red);padding-top:2px}
.chapter .cx{color:var(--ink-2)}
details.notes-block{border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
details.notes-block summary{list-style:none;cursor:pointer;padding:13px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;font-weight:600}
details.notes-block summary::-webkit-details-marker{display:none}
details.notes-block summary::after{content:"+";color:var(--red);font-size:16px;font-weight:400}
details.notes-block[open] summary::after{content:"–"}
.notes-body{padding:0 14px 16px;border-top:1px solid var(--line);padding-top:13px}
.notes-body p{font-size:12.5px;line-height:1.85;color:var(--ink-2);margin:0 0 .8em}
.notes-body p:last-child{margin-bottom:0}
.note-editor{margin-top:10px}
.note-editor textarea{
  width:100%;min-height:110px;resize:vertical;border:1px solid var(--line);border-radius:12px;
  background:var(--card);color:var(--ink);padding:12px;font:inherit;font-size:13px;line-height:1.7;outline:none;
}
.note-editor textarea:focus{border-color:rgba(163,58,47,.45);box-shadow:0 0 0 3px rgba(163,58,47,.08)}
.note-status{font-size:10px;color:var(--muted);margin-top:6px;height:14px}
.sheet-footer{display:flex;flex-direction:column;gap:10px;margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
.listen-link{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border-radius:12px;background:var(--ink);color:var(--paper);font-size:13px;font-weight:600;text-decoration:none}
.listen-link svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
.source-note{font-size:10.5px;color:var(--muted);line-height:1.7;margin-top:12px}

/* bottom nav */
.bottom-nav{
  position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:60;
  width:100%;max-width:760px;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding:7px 12px env(safe-area-inset-bottom);
  display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
  background:var(--paper);
  background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:saturate(1.2) blur(18px);-webkit-backdrop-filter:saturate(1.2) blur(18px);
  border-top:1px solid var(--line);
}
.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:12px;color:var(--muted);font-size:9.5px;letter-spacing:.08em;transition:color .2s,background .2s}
.nav-item svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nav-item.active{color:var(--red);background:rgba(163,58,47,.055)}
.nav-item.active svg{stroke-width:1.9}

/* toast */
.toast{
  position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 18px);transform:translate(-50%,12px);
  background:var(--ink);color:var(--paper);font-size:12px;padding:9px 15px;border-radius:999px;z-index:200;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:var(--shadow);white-space:nowrap;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* desktop */
@media (min-width:720px){
  body{font-size:15.5px}
  .wrap{padding:0 28px}
  .header-inner{padding:14px 28px}
  .hero{padding:42px 0 34px}
  .hero h1{font-size:54px}
  .hero-cover{width:280px;height:280px;right:0;top:10px;opacity:.2}
  .module-grid{grid-template-columns:repeat(4,1fr)}
  .module-card{min-height:170px}
  .related-grid{grid-template-columns:repeat(3,1fr)}
  .sheet-content{padding:30px 28px 80px}
  .home-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;align-items:start}
}
@media (max-width:380px){
  .hero-stats{grid-template-columns:repeat(2,1fr)}
  .hero-stat:nth-child(2){border-right:0}
  .hero-stat:nth-child(n+3){border-top:1px solid var(--line)}
  .module-grid{grid-template-columns:1fr}
  .related-grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
@media print{
  .app-header,.bottom-nav,.toast,.sheet,.hero-actions,.search-wrap,.chips{display:none!important}
  body{background:#fff;color:#000;padding:0}
  .view{display:block!important}
  .view:not(.active){display:none!important}
  .module-card,.ep-row,.host-card{box-shadow:none}
}

/* ===== v2: 播客封面同色系（橙 / 墨黑 / 奶油） ===== */
:root{--nav-bg:#171512;--hero-ink:#171512;--hero-ink-soft:#4a3a20;}
html[data-theme="dark"]{--nav-bg:#0d0b08;--hero-ink:#171512;--hero-ink-soft:#4a3a20;}
.brand-logo{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);object-fit:cover;flex:none;background:var(--orange)}
.brand-text strong{font-size:17px;letter-spacing:.12em}
.brand-text span{text-transform:none;letter-spacing:.08em;font-size:9px}
.app-header{border-bottom:1px solid var(--ink)}
.app-header.scrolled{box-shadow:0 5px 0 rgba(245,166,35,.22)}
.icon-btn:hover,.icon-btn:focus-visible{background:var(--orange);color:var(--ink)}
.icon-btn.on{color:var(--red);background:rgba(245,166,35,.2)}
.hero{background:var(--orange);border-bottom:3px solid var(--ink);color:var(--hero-ink);padding:28px 0 24px}
.hero::after{inset:0;height:auto;border-radius:0;background:
  radial-gradient(circle at 1px 1px, rgba(23,21,18,.13) 1px, transparent 1.4px) 0 0/14px 14px;
  opacity:.55;pointer-events:none;mix-blend-mode:multiply}
.hero-cover{position:absolute;right:18px;top:30px;width:104px;height:104px;object-fit:cover;border-radius:16px;
  border:2px solid var(--hero-ink);box-shadow:5px 5px 0 var(--hero-ink);opacity:1;filter:none;
  mask-image:none;-webkit-mask-image:none;transform:rotate(2deg);z-index:2}
.hero .eyebrow{color:var(--hero-ink);max-width:calc(100% - 126px)}
.hero .eyebrow::before{background:var(--hero-ink)}
.hero h1{color:var(--hero-ink);max-width:calc(100% - 122px);font-size:clamp(32px,8.8vw,52px)}
.hero h1 em{color:#171512;background:#fbf3e3;padding:0 .08em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.hero h1 em::after{display:none}
.hero-lead{color:var(--hero-ink-soft);max-width:calc(100% - 10px)}
.hero-lead strong{color:var(--hero-ink)}
.hero-stats{border-color:rgba(23,21,18,.4);margin-top:20px}
.hero-stat{border-color:rgba(23,21,18,.28)}
.hero-stat b{color:var(--hero-ink)}
.hero-stat span{color:var(--hero-ink-soft)}
.hero .btn-primary{background:var(--hero-ink);color:#fbf3e3;border-color:var(--hero-ink)}
.hero .btn-primary:hover{background:var(--paper);color:var(--hero-ink);border-color:var(--hero-ink)}
.hero .btn-ghost{border-color:rgba(23,21,18,.55);color:var(--hero-ink)}
.hero .btn-ghost:hover{border-color:var(--hero-ink);color:var(--hero-ink);background:rgba(255,249,236,.45)}
.hero-actions .btn{box-shadow:2px 2px 0 rgba(23,21,18,.2)}
.host-card,.path-card,.module-card,.ep-row,.book-card,.about-card,.quote-card,.case-card,.me-stat,.note-item,.next-module{box-shadow:3px 3px 0 rgba(23,21,18,.07)}
.module-card:hover,.ep-row:hover{border-color:var(--ink);box-shadow:5px 5px 0 rgba(245,166,35,.25);transform:translateY(-1px)}
.module-card .mno,.section-head .kicker,.path-card .stage,.module-hero .mno{color:var(--red)}
.module-card::before{border-color:rgba(169,90,5,.18)}
.pill{background:rgba(245,166,35,.16);color:#7a4a05}
.pill.red{background:var(--orange);color:#271b0a}
.pill.gold{background:rgba(169,90,5,.13);color:var(--gold)}
.core-tag{background:var(--orange);color:#241a0a;font-weight:700}
.ep-row .ep-label{color:var(--red);font-weight:700}
.ep-row .ep-date{color:var(--muted)}
.ep-row .mini-tag{background:var(--paper-2)}
.ep-row .done-dot{background:var(--red)}
.ep-row.is-done{background:color-mix(in srgb,var(--orange) 9%,var(--card))}
.chip.active{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip:hover{border-color:var(--red);color:var(--red)}
.search-wrap{border-color:var(--line-strong)}
.search-wrap:focus-within{border-color:var(--red);box-shadow:0 0 0 3px rgba(245,166,35,.14)}
.btn-primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn-primary:hover{background:var(--orange);border-color:var(--orange);color:var(--ink)}
.btn-ghost:hover{border-color:var(--red);color:var(--red);background:rgba(245,166,35,.08)}
.bottom-nav{background:var(--nav-bg);border-top:2px solid var(--orange);backdrop-filter:none;-webkit-backdrop-filter:none}
.nav-item{color:rgba(251,241,221,.62)}
.nav-item.active{color:var(--orange);background:rgba(245,166,35,.14)}
.nav-item.active svg{stroke:var(--orange)}
.toast{background:var(--orange);color:var(--hero-ink);font-weight:600}
.sheet-header{background:var(--orange);border-bottom:2px solid var(--ink)}
.sheet-header .sh-label{color:var(--hero-ink);font-weight:700}
.sheet-header .icon-btn{color:var(--hero-ink)}
.sheet-header .icon-btn:hover{background:rgba(23,21,18,.12);color:var(--hero-ink)}
.sheet-kicker,.sheet-section h2 .idx{color:var(--red)}
.sheet-line{border-left-color:var(--orange)}
.sheet-toolbar .tool-btn.on{color:#7a4a05;border-color:rgba(169,90,5,.4);background:rgba(245,166,35,.16)}
.notes-block summary::after{color:var(--red)}
.listen-link{background:var(--ink);color:var(--paper)}
.listen-link:hover{background:var(--orange);color:var(--ink)}
@media (max-width:420px){
  .hero-cover{position:static;width:84px;height:84px;margin:0 0 14px;transform:rotate(-2deg)}
  .hero .eyebrow,.hero h1{max-width:100%}
  .hero h1{font-size:clamp(30px,9.6vw,38px)}
  .hero-lead{font-size:13px}
}
@media (min-width:720px){
  .hero-cover{width:156px;height:156px;right:28px;top:34px}
  .hero h1{max-width:calc(100% - 180px)}
  .hero .eyebrow{max-width:calc(100% - 186px)}
}


/* ===== Vol 精读页 ===== */
.vol-hero{padding:18px 0 22px;border-bottom:3px solid var(--ink)}
.vol-hero .vol-kicker{display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.16em;color:var(--red);font-weight:700}
.vol-hero .vol-kicker .dot{width:7px;height:7px;border-radius:50%;background:var(--orange);display:inline-block}
.vol-hero h1{font-size:clamp(27px,7vw,40px);line-height:1.28;margin-top:9px}
.vol-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;font-size:10.5px;color:var(--muted)}
.vol-meta .core-tag{font-size:9px}
.vol-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.vol-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.vol-line{margin-top:18px;background:var(--orange);color:var(--hero-ink);border:2px solid var(--ink);border-radius:14px;padding:14px 15px;font-family:var(--serif);font-size:16px;line-height:1.65;box-shadow:4px 4px 0 rgba(23,21,18,.14)}
.vol-line .vl-k{display:block;font-family:var(--sans);font-size:9.5px;letter-spacing:.16em;font-weight:700;margin-bottom:6px;opacity:.72}
.vol-body{padding-top:6px}
.vol-section{padding:22px 0;border-bottom:1px solid var(--line)}
.vol-section h2{font-size:20px;line-height:1.35;display:flex;align-items:center;gap:9px;margin-bottom:12px}
.vol-section h2 .num{font-family:var(--mono);font-size:10px;color:var(--red);font-weight:400;letter-spacing:.08em}
.vol-section .lead-note{font-size:11px;color:var(--muted);line-height:1.7;margin:-4px 0 12px}
.excerpt{display:grid;grid-template-columns:56px 1fr;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.excerpt:last-child{border-bottom:0}
.excerpt .ex-time{font-family:var(--mono);font-size:10px;color:var(--red);padding-top:3px}
.excerpt p{font-size:13px;line-height:1.8;color:var(--ink-2);margin:0}
.excerpt .ex-note{font-size:10.5px;color:var(--muted);margin-top:5px}
.analysis-box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px}
.analysis-box h3{font-size:14px;margin-bottom:6px}
.analysis-box p{font-size:12.5px;line-height:1.8;color:var(--ink-2)}
.analysis-box ul{margin:0;padding-left:18px;font-size:12.5px;line-height:1.8;color:var(--ink-2)}
.analysis-box li{margin-bottom:6px}
.transcript-tools{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.transcript-tools input{flex:1;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink);padding:8px 10px;font:inherit;font-size:11.5px;outline:none}
.transcript-tools input:focus{border-color:var(--red)}
.transcript-tools button{border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:10.5px;color:var(--red);background:var(--card);white-space:nowrap}
.tr-chunk{display:grid;grid-template-columns:56px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px;line-height:1.75}
.tr-chunk:last-child{border-bottom:0}
.tr-chunk .tr-time{font-family:var(--mono);font-size:10px;color:var(--red);padding-top:3px}
.tr-chunk p{margin:0;color:var(--ink-2)}
.tr-empty{font-size:12px;color:var(--muted);padding:14px;border:1px dashed var(--line);border-radius:11px;text-align:center}
.vol-year{display:flex;align-items:center;gap:10px;margin:22px 0 9px;padding-bottom:7px;border-bottom:2px solid var(--ink)}
.vol-year b{font-family:var(--serif);font-size:22px;line-height:1}
.vol-year span{font-size:10px;color:var(--muted);letter-spacing:.1em}
.vol-year em{margin-left:auto;font-style:normal;font-size:10px;color:var(--red)}
.ep-row .tr-badge{font-size:9px;color:#7a4a05;background:rgba(245,166,35,.18);border-radius:4px;padding:2px 5px}
.ep-row .tr-badge.pending{color:var(--muted);background:var(--paper-2)}


.tr-status{display:inline-flex;align-items:center;gap:7px;margin-top:14px;font-size:10.5px;color:var(--hero-ink-soft);background:rgba(255,249,236,.42);border:1px solid rgba(23,21,18,.22);border-radius:999px;padding:5px 10px}
.tr-dot{width:6px;height:6px;border-radius:50%;background:var(--hero-ink);display:inline-block;animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}


.module-quote{display:grid;grid-template-columns:54px 1fr;gap:11px;width:100%;text-align:left;padding:12px 0;border-bottom:1px dashed var(--line);background:none}
.module-quote:last-child{border-bottom:0}
.module-quote:hover .mq-text{color:var(--red)}
.mq-time{font-family:var(--mono);font-size:10px;color:var(--red);padding-top:3px}
.mq-body{display:flex;flex-direction:column;gap:5px}
.mq-text{font-family:var(--serif);font-size:15px;line-height:1.65;color:var(--ink)}
.mq-src{font-size:9.5px;color:var(--muted);letter-spacing:.04em}


/* 荧光笔重点句：主题橙，80% 透明 */
mark.hl{
  background:linear-gradient(180deg,transparent 10%,rgba(245,166,35,.20) 10%,rgba(245,166,35,.20) 93%,transparent 93%);
  color:inherit;padding:0 .10em;margin:0 -.02em;border-radius:2px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;
}
html[data-theme="dark"] mark.hl{
  background:linear-gradient(180deg,transparent 10%,rgba(255,193,77,.22) 10%,rgba(255,193,77,.22) 93%,transparent 93%);
}


/* ===== 精读主页 ===== */
.picks-section{padding-top:26px}
.picks{border-top:1px solid var(--line)}
.pick-item{display:grid;grid-template-columns:38px 1fr 16px;gap:10px;width:100%;text-align:left;padding:14px 0;border-bottom:1px solid var(--line);background:none;transition:background .2s}
.pick-item:last-child{border-bottom:0}
.pick-item:hover{background:rgba(245,166,35,.06)}
.pick-no{font-family:var(--serif);font-size:16px;color:var(--red);padding-top:2px}
.pick-main{display:flex;flex-direction:column;gap:4px;min-width:0}
.pick-top{display:flex;align-items:center;gap:7px;font-size:9.5px;color:var(--muted)}
.pick-vol{font-family:var(--mono);color:var(--red);font-weight:700}
.pick-title{font-family:var(--serif);font-size:16px;line-height:1.35;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pick-reason{font-size:11.5px;color:var(--muted);line-height:1.65}
.pick-reason b{color:var(--red);font-weight:600;margin-right:6px}
.pick-core{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
.pick-core span{font-size:9.5px;background:rgba(245,166,35,.14);border:1px solid rgba(245,166,35,.22);color:#7a4a05;border-radius:4px;padding:2px 5px}
html[data-theme="dark"] .pick-core span{color:#ffc45c;background:rgba(245,166,35,.1);border-color:rgba(245,166,35,.2)}
.pick-arrow{font-size:16px;color:var(--red);align-self:center}
.picks-foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px}
.picks-foot .btn{padding:9px 14px;font-size:12px}
.picks-foot span{font-size:10.5px;color:var(--muted);line-height:1.6;flex:1;min-width:180px}
.two-ways{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.way-card{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:5px;box-shadow:3px 3px 0 rgba(23,21,18,.06)}
.way-card:hover{border-color:var(--ink);box-shadow:5px 5px 0 rgba(245,166,35,.22)}
.way-no{font-family:var(--serif);font-size:30px;line-height:1;color:var(--orange)}
.way-title{font-family:var(--serif);font-size:19px;color:var(--ink)}
.way-desc{font-size:11px;color:var(--muted);line-height:1.65}
.way-go{margin-top:auto;padding-top:10px;font-size:10.5px;color:var(--red)}
.host-mini{display:flex;align-items:center;gap:13px;border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--card);box-shadow:3px 3px 0 rgba(23,21,18,.06)}
.host-mini img{width:52px;height:52px;border-radius:12px;border:1px solid var(--ink);flex:none;object-fit:cover}
.host-mini-main{min-width:0}
.hm-name{font-family:var(--serif);font-size:17px}
.hm-name span{font-family:var(--sans);font-size:10px;color:var(--muted)}
.hm-role{font-size:10px;color:var(--muted);margin-top:2px}
.host-mini-main p{font-size:11px;color:var(--muted);line-height:1.6;margin-top:5px}
.hm-more{margin-left:auto;font-size:10.5px;color:var(--red);white-space:nowrap;align-self:flex-start;padding-top:2px}
.home-note{border-top:1px solid var(--line);padding-top:14px;font-size:10.5px;color:var(--muted);line-height:1.75}
.home-note b{color:var(--red);font-weight:600}
.home-note-links{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.home-note-links button,.home-note-links a{font-size:10.5px;color:var(--red);text-decoration:none}
@media (max-width:420px){.picks-section .section-head{display:block}.picks-section .link-more{margin-top:8px}.pick-item{grid-template-columns:30px 1fr 14px;gap:8px}.pick-title{font-size:15px}.two-ways{grid-template-columns:1fr}.way-no{font-size:26px}.host-mini{align-items:flex-start}.hm-more{display:none}}

/* ===== 学习导读 ===== */
.learn-path{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.learn-step{display:flex;flex-direction:column;gap:5px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:3px 3px 0 rgba(23,21,18,.06);transition:transform .18s,border-color .2s,box-shadow .2s}
.learn-step:hover{transform:translateY(-1px);border-color:var(--ink);box-shadow:5px 5px 0 rgba(245,166,35,.24)}
.ls-no{font-family:var(--serif);font-size:26px;line-height:1;color:var(--orange)}
.ls-title{font-family:var(--serif);font-size:16px;line-height:1.35}
.ls-text{font-size:11px;color:var(--muted);line-height:1.65}
.guide-index{display:grid;gap:0;border-top:1px solid var(--line);padding-top:2px}

.gi-title{font-family:var(--serif);font-size:16px;line-height:1.35;color:var(--ink)}
.gi-teaser{font-size:11px;color:var(--muted);line-height:1.55;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gi-arrow{font-size:15px;color:var(--red)}
.module-card .mguide{font-size:10.5px;color:var(--red);line-height:1.55;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;opacity:.9}

.cg-hook{font-family:var(--serif);font-size:18px;line-height:1.72;margin-top:9px;color:var(--ink)}
.cg-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.cg-block h3,.cg-path h3{font-size:12px;font-family:var(--sans);letter-spacing:.04em;color:var(--red);margin-bottom:7px;font-weight:600}
.cg-block ol,.cg-block ul{margin:0;padding-left:17px;font-size:12px;line-height:1.75;color:var(--ink-2)}
.cg-block li{margin-bottom:5px}
.cg-path{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.cg-route{display:flex;gap:7px;flex-wrap:wrap}
.cg-route-item{display:flex;flex-direction:column;gap:3px;text-align:left;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--paper);max-width:220px;transition:border-color .2s,background .2s}
.cg-route-item:hover{border-color:var(--red);background:rgba(245,166,35,.06)}
.cg-route-item b{font-family:var(--mono);font-size:9.5px;color:var(--red);font-weight:600}
.cg-route-item span{font-size:10.5px;color:var(--muted);line-height:1.5}
.vol-guide{margin-top:18px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--orange);border-radius:14px;padding:15px 16px;box-shadow:3px 3px 0 rgba(23,21,18,.06)}
.vg-label{font-size:9.5px;letter-spacing:.18em;color:var(--red);font-weight:700;text-transform:uppercase}
.vg-hook{font-family:var(--serif);font-size:16.5px;line-height:1.75;margin-top:7px;color:var(--ink)}
.vg-question{margin-top:11px;padding-top:10px;border-top:1px dashed var(--line);font-size:12px;color:var(--ink-2);line-height:1.65}
.vg-question b{color:var(--red);font-weight:600;margin-right:5px}
.vg-keys{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.vg-keys span{font-size:9.5px;background:rgba(245,166,35,.14);border:1px solid rgba(245,166,35,.22);color:#7a4a05;border-radius:4px;padding:2px 6px}
html[data-theme="dark"] .vg-keys span{color:#ffc45c;background:rgba(245,166,35,.1);border-color:rgba(245,166,35,.2)}
.guide-badge{display:inline-block;font-size:9px;line-height:1.5;color:var(--red);border:1px solid rgba(169,90,5,.35);border-radius:4px;padding:0 5px;margin-right:5px;vertical-align:1px;font-weight:600}
.recap-note{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.6}
.rm-title{font-size:9.5px;letter-spacing:.16em;color:var(--red);font-weight:700;margin-top:16px;margin-bottom:8px}
.read-map{display:flex;flex-direction:column;gap:0;margin-top:2px}
.rm-step{display:grid;grid-template-columns:28px 1fr;gap:10px;position:relative;padding-bottom:10px}
.rm-step:not(:last-child)::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:1px;background:var(--line-strong)}
.rm-node{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:var(--mono);font-size:10px;z-index:1;position:relative}
.rm-body{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--paper)}
.rm-kicker{font-size:9px;letter-spacing:.12em;color:var(--red);font-weight:700}
.rm-body h4{font-family:var(--serif);font-size:13.5px;line-height:1.4;margin-top:2px;color:var(--ink)}
.rm-body p{font-size:11px;line-height:1.6;color:var(--muted);margin:3px 0 0}
.vol-map{margin-top:12px;padding:12px 14px;border:1px dashed var(--line-strong);border-radius:14px;background:rgba(245,166,35,.04)}
html[data-theme="dark"] .vol-map{background:rgba(245,166,35,.03)}
.ebook-card{display:flex;gap:18px;align-items:center;justify-content:space-between;border:2px solid var(--ink);border-radius:16px;background:var(--card);padding:16px;box-shadow:4px 4px 0 rgba(245,166,35,.24)}
.ebook-copy .kicker{color:var(--red);font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:700}
.ebook-copy h3{font-size:20px;line-height:1.35;margin-top:4px}
.ebook-copy p{font-size:11.5px;color:var(--muted);line-height:1.65;margin-top:5px;max-width:34em}
.ebook-links{display:flex;flex-direction:column;gap:7px;flex:none}
.ebook-links .btn{padding:9px 13px;font-size:11.5px;white-space:nowrap}
@media (max-width:560px){
  .ebook-card{display:block}
  .ebook-links{margin-top:12px;flex-direction:row;flex-wrap:wrap}
  .ebook-links .btn{flex:1;min-width:128px}
}
@media (max-width:560px){
  .learn-path{grid-template-columns:1fr}
  .cg-grid{grid-template-columns:1fr}
  .cg-route-item{max-width:none;width:100%}
  .gi-row{grid-template-columns:34px 1fr 12px;gap:8px}
  .module-card .mguide{-webkit-line-clamp:3}
}

/* Apple Liquid Glass 2026 — tokens */
:root{
  --font-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;
  --font-read:"New York","Songti SC","Noto Serif SC","STSong",serif;
  --serif:var(--font-display);
  --paper:#f3eee5;--paper-2:#ebe3d7;--card:rgba(255,255,255,.58);--ink:#1d1d1f;--ink-2:#3a3a3c;--muted:#6e6e73;
  --line:rgba(60,60,67,.13);--line-strong:rgba(60,60,67,.24);--orange:#f5a623;--orange-2:#ffb84d;--red:#a95a05;--red-2:#c26a08;--gold:#8a5a1c;
  --glass:rgba(255,255,255,.56);--glass-strong:rgba(255,255,255,.74);--glass-border:rgba(255,255,255,.72);--glass-highlight:rgba(255,255,255,.88);
  --glass-blur:saturate(180%) blur(24px);--glass-shadow:0 24px 64px rgba(31,35,60,.14),inset 0 1px 0 rgba(255,255,255,.82);
  --shadow:0 24px 64px rgba(31,35,60,.14);--shadow-sm:0 10px 30px rgba(31,35,60,.09);--nav-h:84px;
  --hero-ink:#1d1d1f;--hero-ink-soft:#4a4a4f;--hero-bg:radial-gradient(120% 120% at 88% -10%,rgba(255,255,255,.9),transparent 48%),linear-gradient(135deg,#ffe8c4 0%,#ffc766 48%,#fff1d8 100%);
  --hero-em:linear-gradient(90deg,#6b3b00,#a95a05);--hero-glass:rgba(255,255,255,.32);--hero-glass-border:rgba(255,255,255,.55);--hero-divider:rgba(23,21,18,.09);--hero-primary-bg:#1d1d1f;--hero-primary-color:#fff;
  --line-card-bg:linear-gradient(135deg,rgba(255,226,176,.94),rgba(255,190,82,.8));--line-card-color:#1d1d1f;--rm-body:rgba(255,255,255,.38);--rm-body-border:rgba(255,255,255,.55);
  --ambient-1:rgba(255,159,10,.20);--ambient-2:rgba(255,99,132,.10);--ambient-3:rgba(64,156,255,.10);
}

    --glass:rgba(28,28,32,.56);--glass-strong:rgba(40,40,44,.76);--glass-border:rgba(255,255,255,.14);--glass-highlight:rgba(255,255,255,.18);
    --glass-shadow:0 24px 70px rgba(0,0,0,.58),inset 0 1px 0 rgba(255,255,255,.14);--nav-bg:rgba(28,28,32,.56);

    --hero-glass:rgba(255,255,255,.07);--hero-glass-border:rgba(255,255,255,.14);--hero-divider:rgba(255,255,255,.12);--hero-primary-bg:#f5f5f7;--hero-primary-color:#1d1d1f;
    --line-card-bg:linear-gradient(135deg,rgba(255,159,10,.22),rgba(255,159,10,.08));--line-card-color:#f5f5f7;--rm-body:rgba(255,255,255,.06);--rm-body-border:rgba(255,255,255,.12);

  color-scheme:dark;--paper:#09090b;--paper-2:#141418;--card:rgba(28,28,32,.52);--ink:#f5f5f7;--ink-2:#d1d1d6;--muted:#a1a1a6;
  --line:rgba(255,255,255,.12);--line-strong:rgba(255,255,255,.22);--orange:#ff9f0a;--orange-2:#ffb340;--red:#ffb340;--red-2:#ffc45c;--gold:#d9a441;
  --glass:rgba(28,28,32,.56);--glass-strong:rgba(40,40,44,.76);--glass-border:rgba(255,255,255,.14);--glass-highlight:rgba(255,255,255,.18);
  --glass-shadow:0 24px 70px rgba(0,0,0,.58),inset 0 1px 0 rgba(255,255,255,.14);--nav-bg:rgba(28,28,32,.56);
  --hero-ink:#f5f5f7;--hero-ink-soft:#c7c7cc;--hero-bg:radial-gradient(120% 120% at 88% 0%,rgba(255,159,10,.22),transparent 48%),linear-gradient(135deg,#241708 0%,#160f08 55%,#09090b 100%);--hero-em:linear-gradient(90deg,#ffd60a,#ff9f0a);
  --hero-glass:rgba(255,255,255,.07);--hero-glass-border:rgba(255,255,255,.14);--hero-divider:rgba(255,255,255,.12);--hero-primary-bg:#f5f5f7;--hero-primary-color:#1d1d1f;

  --ambient-1:rgba(255,159,10,.16);--ambient-2:rgba(255,99,132,.08);--ambient-3:rgba(64,156,255,.08);

body{font-family:var(--font-ui);font-size:15px;line-height:1.7;letter-spacing:-.005em;color:var(--ink);background:radial-gradient(1100px 620px at 8% -8%,var(--ambient-1),transparent 62%),radial-gradient(900px 540px at 100% 2%,var(--ambient-2),transparent 62%),radial-gradient(950px 720px at 48% 112%,var(--ambient-3),transparent 64%),var(--paper);background-attachment:fixed;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
h1,h2,h3,h4{font-family:var(--font-display);letter-spacing:-.025em;text-wrap:balance}
::selection{background:rgba(245,166,35,.28)}
.app-header{top:max(10px,env(safe-area-inset-top));width:calc(100% - 24px);max-width:760px;margin:10px auto 0;border:1px solid var(--glass-border);border-radius:24px;background:var(--glass);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);box-shadow:var(--glass-shadow)}
.app-header.scrolled{border-color:var(--glass-border);box-shadow:0 18px 50px rgba(31,35,60,.16),inset 0 1px 0 var(--glass-highlight)}
.header-inner{padding:9px 14px}
.brand-logo{width:36px;height:36px;border:0;border-radius:12px;box-shadow:0 8px 22px rgba(120,70,0,.2);background:var(--orange)}
.brand-text strong{font-family:var(--font-display);font-size:15.5px;letter-spacing:.04em}.brand-text span{font-size:9px;letter-spacing:.16em;color:var(--muted)}
.seal{background:linear-gradient(180deg,var(--orange-2),var(--orange));color:#1d1d1f;box-shadow:0 8px 20px rgba(245,166,35,.25)}
.icon-btn{width:40px;height:40px;border:1px solid transparent;background:transparent;color:var(--ink-2);border-radius:50%;transition:background .2s,color .2s,transform .2s}

<script>
const DATA = /*__DATA__*/;
const STORE_KEY = 'hkt-handbook-v1';
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = (s='') => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId = Object.fromEntries(DATA.episodes.map(e => [e.n, e]));
const modById = Object.fromEntries(DATA.modules.map(m => [m.id, m]));
const pad = n => String(n).padStart(2,'0');

let state = { done:{}, saved:{}, notes:{}, takes:{}, theme:null };
try { state = Object.assign(state, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch(e) {}
if (!state.takes) state.takes = {};
if (state.theme) document.documentElement.dataset.theme = state.theme;
else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';

function saveState(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e){} }
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), 1700);
}
function epTitle(e){ return e.title.replace(/^(?:Vol\.|V)\d+[.、\s]*/i,'').trim(); }
function shortTitle(e, len=30){ const t = epTitle(e); return t.length > len ? t.slice(0,len)+'…' : t; }
function firstSentence(s, len=46){ const t = String(s||'').split(/[。！？]/)[0]; return t.length > len ? t.slice(0,len)+'…' : t; }
function readMap(steps){
  if (!steps || !steps.length) return '';
  return `<div class="read-map">${steps.map((s,i)=>`<div class="rm-step">
    <div class="rm-node">${pad(i+1)}</div>
    <div class="rm-body">
      <div class="rm-kicker">${esc(s.k||'')}</div>
      ${s.h?`<h4>${esc(s.h)}</h4>`:''}
      ${s.p?`<p>${esc(s.p)}</p>`:''}
    </div>
  </div>`).join('')}</div>`;
}
function durText(e){
  const s = e.seconds; const h = Math.floor(s/3600), m = Math.round((s%3600)/60);
  return h ? `${h} 小时 ${m} 分` : `${m} 分钟`;
}
function epMeta(e){ return `${e.date} · ${durText(e)}${e.chapters.length ? ' · '+e.chapters.length+' 个章节' : ''}`; }
function fmtTime(sec){ sec=Math.max(0,Math.floor(sec||0)); const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s2=sec%60; return h?`${h}:${String(m).padStart(2,'0')}:${String(s2).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(s2).padStart(2,'0')}`; }
function doneCount(){ return Object.keys(state.done).filter(k=>state.done[k]).length; }
function savedCount(){ return Object.keys(state.saved).filter(k=>state.saved[k]).length; }
function noteCount(){ return Object.values(state.notes).filter(v=>v && v.trim()).length; }
function epHref(e){ return e.link || DATA.podcast.url; }
function moduleName(id){ return modById[id]?.title || ''; }
function modEpCount(id){ return DATA.episodes.filter(e=>(e.mods||[]).includes(id)).length; }
function modLabel(e){ return (e.mods||[]).map(moduleName).filter(Boolean).slice(0,2); }
function tagPills(tags, cls=''){ return (tags||[]).map(t=>`<span class="pill ${cls}">${esc(t)}</span>`).join(''); }
function refChips(eps, max=3){ return (eps||[]).slice(0,max).map(n=>byId[n]?`<button class="ref-chip" data-ep="${n}">${esc(byId[n].label)}</button>`:'').join(''); }

/* ---------- highlighter ---------- */
const HL_WORDS = ['投资','资产','风险','收益','配置','周期','基金','市场','财富','选择','长期','安全','自由','现金','杠杆','回撤','价值','价格','认知','信息','家庭','健康','时间','能力','边界','概率','结构','复利','本质','系统','信任','情绪','目标','成本','策略'];
function hlScore(s){
  let v = 0;
  for (const w of HL_WORDS) if (s.includes(w)) v += 1.2;
  if (s.length >= 18 && s.length <= 82) v += 1;
  if (/本质|关键|最重要|不是|而是|所以|因此|真正|其实|必须|不要|应该|只有|才能|长期|复利/.test(s)) v += 1.2;
  if (/[0-9]/.test(s)) v += .2;
  if (/^(这一期|今天|我们|大家|首先|然后|那么|但是)/.test(s)) v -= .7;
  if (/[？?]$/.test(s)) v -= .2;
  return v;
}
function hlPick(text){
  const parts = (text || '').match(/[^。！？；!?;\n]+[。！？；!?;]?/g) || [];
  let best = null;
  for (const raw of parts){
    const s = raw.trim();
    if (s.length < 12 || s.length > 100) continue;
    const sc = hlScore(s);
    if (!best || sc > best.score) best = { sentence: s, score: sc };
  }
  if (best && best.score > 0) return best;
  for (const raw of parts){
    const s = raw.trim();
    if (s.length >= 10) return { sentence: s, score: 0 };
  }
  return null;
}
function hlWrap(el, sentence){
  if (!el || el.querySelector('mark.hl')) return;
  const text = el.textContent || '';
  const idx = text.indexOf(sentence);
  if (idx < 0) return;
  el.innerHTML = esc(text.slice(0, idx)) + '<mark class="hl">' + esc(sentence) + '</mark>' + esc(text.slice(idx + sentence.length));
}
function applyHighlights(root){
  if (!root) return;
  root.querySelectorAll('.excerpt p, .module-quote .mq-text, .principle p').forEach(el=>{
    const pick = hlPick(el.textContent);
    if (pick) hlWrap(el, pick.sentence);
  });
  root.querySelectorAll('.analysis-box, .module-section').forEach(box=>{
    const ps = [...box.querySelectorAll(':scope > p')];
    let best = null, bestEl = null;
    for (const p of ps){
      const pick = hlPick(p.textContent);
      if (pick && (!best || pick.score > best.score)) { best = pick; bestEl = p; }
    }
    if (bestEl) hlWrap(bestEl, best.sentence);
  });
}

function renderHome(){

    { n: 15, reason: '董艺婷用 21 年买方经历讲她为什么选 FOF：越微观越算法，越宏观越人脑。', core: ['FOF', '方法论多样性', '敬畏'] },
    { n: 26, reason: '这一期把黄金、商品、CTA 与危机 Alpha 一次讲清，也讲清它们什么时候失效。', core: ['商品定价', '危机 Alpha', 'CTA'] },
    { n: 27, reason: '这一期讲清 Beta 与 Alpha，用四问拆指数、指增与 ETF。', core: ['宽基', '指增', '跟踪误差'] },
    { n: 43, reason: '这一期复盘上半年并给出下半年配置：低利率下别信 5%-6% 的“无风险”。', core: ['微观年', '拥挤度', '哑铃'] },
    { n: 60, reason: '这一期讲周期：它是地图不是时钟，普通人只需要“模糊的准确”。', core: ['周期嵌套', '情绪钟摆', '打分表'] },
    { n: 71, reason: '这一期用“往外看 / 往内看”两只眼睛，搭一个 2026 年睡得踏实的组合。', core: ['世界叙事', '机构行为', '财富地图'] },
    { n: 97, reason: '这一期请韭菜之王复盘十年踩坑：合同、结构、利益一致性比明星项目重要。', core: ['股权份额', '工商变更', '双录'] },
    { n: 106, reason: '这一期请两位嘉宾讲两种人生、四层资产：以支定收，先算下限，再谈自由。', core: ['四层资产', '以支定收', '现金流'] },
  ];

  $('#view-home').innerHTML = `
  <div class="hero">
    <img class="hero-cover" src="__LOGO__" alt="慧客堂封面">
    <div class="wrap hero-inner">
      <div class="eyebrow">老听众整理 · ${p.firstDate} — ${p.lastDate}</div>
      <h1>把「慧客堂」<br>读成一本<br><em>人生的资产配置书</em></h1>
      <p class="hero-lead"><strong>${p.count} 期，${p.hours} 小时。</strong>先读一章导读，带着问题进入；再按 Vol 回到原声，把听到的变成自己的判断。</p>
      <div class="hero-stats">
        <div class="hero-stat"><b>${p.count}</b><span>期节目</span></div>
        <div class="hero-stat"><b>${p.hours}</b><span>小时音频</span></div>
        <div class="hero-stat"><b>${DATA.podcast.transcriptWan || 0}</b><span>万字逐字稿</span></div>
        <div class="hero-stat"><b>${DATA.episodes.filter(e=>e.dongliao).length}</b><span>条董了</span></div>
      </div>
      <div class="hero-actions">
        <button class="btn btn-primary" data-scroll="chapters">从导读开始 <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
        <button class="btn btn-ghost" data-go="episodes">按 Vol 浏览</button>
      </div>
      <div class="tr-status"><span class="tr-dot"></span>逐字稿 ${DATA.podcast.transcribedCount || 0}/${DATA.podcast.count} 期已转写 · ${DATA.podcast.transcriptWan || 0} 万字原文</div>
    </div>
  </div>

  <div class="wrap">
    <section class="section" id="howto">
      <div class="section-head">
        <div>

let moduleRevealObserver = null;
let moduleNavFrame = false;

function updateModuleSceneNav(){
  const root = $('#view-module');
  if (!root || !location.hash.startsWith('#/module')) return;
  const scenes = [...root.querySelectorAll('.scene')];
  if (!scenes.length) return;
  const focus = window.innerHeight * 0.42;
  let active = 0;
  scenes.forEach((el,i)=>{
    if (el.getBoundingClientRect().top <= focus) active = i;
  });
  root.querySelectorAll('[data-scene-jump]').forEach(b=>{
    const on = b.dataset.sceneJump === String(active);
    b.classList.toggle('active', on);
    b.setAttribute('aria-current', on ? 'true' : 'false');
  });
}
function scheduleModuleSceneNav(){
  if (moduleNavFrame) return;
  moduleNavFrame = true;
  requestAnimationFrame(()=>{ moduleNavFrame = false; updateModuleSceneNav(); });
}

function initModuleMotion(root){
  if (!root) return;
  if (moduleRevealObserver) moduleRevealObserver.disconnect();
  const reveals = [...root.querySelectorAll('.reveal')];
  if (!('IntersectionObserver' in window)) {
    reveals.forEach(el=>el.classList.add('in'));
    return;
  }
  moduleRevealObserver = new IntersectionObserver(entries=>{
    entries.forEach(en=>{
      if (!en.isIntersecting) return;
      en.target.classList.add('in');
      moduleRevealObserver.unobserve(en.target);
    });
  }, { threshold: .12, rootMargin: '0px 0px -6% 0px' });
  reveals.forEach(el=>moduleRevealObserver.observe(el));
  scheduleModuleSceneNav();
}

function bindEpisodes(){
  const input = $('#epSearch');
  if (!input) return;
  input.addEventListener('input', e => { epQuery = e.target.value.trim(); $('#searchClear').classList.toggle('show', !!epQuery); updateEpList(); });
  $('#searchClear').addEventListener('click', ()=>{ epQuery=''; input.value=''; $('#searchClear').classList.remove('show'); updateEpList(); input.focus(); });
  $('#epChips').addEventListener('click', e=>{
    const b=e.target.closest('[data-filter]'); if(!b)return;
    epFilter=b.dataset.filter; $$('#epChips .chip').forEach(x=>x.classList.toggle('active',x===b)); updateEpList();
  });
  $('#sortBtn').addEventListener('click', ()=>{ epSort = epSort==='new'?'old':'new'; $('#sortLabel').textContent = epSort==='new'?'最新在前':'最早在前'; updateEpList(); });
}

function matchEp(e){
  if (epFilter==='core' && !e.core) return false;
  if (epFilter==='董了' && !e.dongliao) return false;
  if (epFilter!=='all' && epFilter!=='core' && epFilter!=='董了' && !(e.tags||[]).includes(epFilter)) return false;
  if (!epQuery) return true;
  const q = epQuery.toLowerCase();
  const hay = [e.title,e.line,e.tags.join(' '),e.mods.map(moduleName).join(' '),e.chapters.map(c=>c.text).join(' '),e.paras.join(' '),(e.keyChunks||[]).map(c=>c.text).join(' '),e.guide?[e.guide.hook,e.guide.question,(e.guide.keywords||[]).join(' ')].join(' '):'',e.dongliao?[e.dongliao.title,e.dongliao.quote,e.dongliao.context,e.dongliao.critique,e.dongliao.insight].join(' '):''].join(' ').toLowerCase();
  return hay.includes(q);
}

function updateEpList(){
  const list = $('#epList'); if(!list)return;
  let arr = DATA.episodes.filter(matchEp);
  arr = arr.slice().sort((a,b)=> epSort==='new'
    ? (b.date.localeCompare(a.date) || b.n-a.n)

/* ---------- Vol transcript helpers ---------- */
function parseTs(s){
  if (typeof s !== 'string') return 0;
  const parts = s.trim().split(':').map(x=>parseInt(x,10));
  if (!parts.length || parts.some(Number.isNaN)) return 0;
  if (parts.length === 3) return parts[0]*3600 + parts[1]*60 + parts[2];
  if (parts.length === 2) return parts[0]*60 + parts[1];
  return parts[0] || 0;
}
function cleanWithMap(s=''){
  const text = String(s);
  const out = [], map = [];
  const fillers = ['这个','那个','就是','然后','嗯','呃','哦','啊','诶','唉','哎'];
  const punct = /[\s，。！？；：、“”‘’（）()《》【】,.!?;:"'\-—…]/;
  let i = 0;
  while (i < text.length){
    let skip = 0;
    for (const f of fillers){
      if (text.startsWith(f, i)) { skip = f.length; break; }
    }
    if (skip){ i += skip; continue; }
    const ch = text[i];
    if (punct.test(ch)){ i++; continue; }
    out.push(ch); map.push(i); i++;
  }
  return { text: out.join(''), map };
}
function editDistance(a, b){
  const n = a.length, m = b.length;
  if (!n) return m;
  if (!m) return n;
  let prev = new Array(m + 1), cur = new Array(m + 1);
  for (let j = 0; j <= m; j++) prev[j] = j;
  for (let i = 1; i <= n; i++){
    cur[0] = i;
    const ca = a.charCodeAt(i - 1);
    for (let j = 1; j <= m; j++){
      const cost = ca === b.charCodeAt(j - 1) ? 0 : 1;
      cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + cost);
    }
    const tmp = prev; prev = cur; cur = tmp;
  }
  return prev[m];
}
function chunkIndexAt(rows, sec){
  if (!rows.length) return -1;
  let lo = 0, hi = rows.length - 1, ans = 0;
  while (lo <= hi){
    const mid = (lo + hi) >> 1;
    if (rows[mid].sec <= sec){ ans = mid; lo = mid + 1; }
    else hi = mid - 1;
  }
  return ans;
}
function findHighlightRange(text, candidate){
  const src = String(text || '');
  const raw = String(candidate || '').trim();
  if (!src || !raw) return null;
  let at = src.indexOf(raw);
  if (at >= 0) return { start: at, end: at + raw.length, method: 'exact' };
  const chunkClean = cleanWithMap(src);
  const candClean = cleanWithMap(raw);
  if (candClean.text.length >= 8 && chunkClean.text){
    const j = chunkClean.text.indexOf(candClean.text);
    if (j >= 0 && candClean.text.length > 0){
      return {
        start: chunkClean.map[j],
        end: chunkClean.map[j + candClean.text.length - 1] + 1,
        method: 'clean'
      };
    }
  }
  if (candClean.text.length >= 12 && chunkClean.text.length >= 12){
    const seedLen = 4;
    const seeds = new Map();
    for (let i = 0; i + seedLen <= chunkClean.text.length; i++){
      const g = chunkClean.text.slice(i, i + seedLen);
      if (!seeds.has(g)) seeds.set(g, i);
    }
    let seed = { score: 0, pos: 0, qi: 0 };
    for (let i = 0; i + seedLen <= candClean.text.length; i++){
      const pos = seeds.get(candClean.text.slice(i, i + seedLen));
      if (pos == null) continue;
      let left = 0, right = seedLen;
      while (i - left > 0 && pos - left > 0 && candClean.text[i-left-1] === chunkClean.text[pos-left-1]) left++;
      while (i + right < candClean.text.length && pos + right < chunkClean.text.length && candClean.text[i+right] === chunkClean.text[pos+right]) right++;
      const len = left + right;
      if (len > seed.score) seed = { score: len, pos: pos - left, qi: i - left };
    }
    if (seed.score >= seedLen){
      const m = candClean.text.length;
      const start0 = seed.pos - seed.qi;
      const minStart = Math.max(0, start0 - 12);
      const maxStart = Math.min(chunkClean.text.length - 12, start0 + 12);
      let best = { sim: 0, start: 0, end: 0 };
      for (let start = minStart; start <= maxStart; start++){
        const minLen = Math.max(12, m - 8);
        const maxLen = Math.min(chunkClean.text.length - start, m + 12);
        for (let len = minLen; len <= maxLen; len++){
          const win = chunkClean.text.slice(start, start + len);
          const sim = 1 - editDistance(win, candClean.text) / Math.max(len, m);
          if (sim > best.sim + 1e-9){
            best = { sim, start, end: start + len };
          }
        }
      }
      if (best.sim >= 0.8 && best.end > best.start){
        return {
          start: chunkClean.map[best.start],
          end: chunkClean.map[best.end - 1] + 1,
          method: 'fuzzy'
        };
      }
    }
  }
  return null;
}
function buildHighlightMap(e, rows){
  const stats = { candidates: 0, exact: 0, clean: 0, fuzzy: 0, miss: 0, applied: 0 };
  const best = new Map();
  const seen = new Set();
  const add = (list, pri) => {
    for (const item of list || []){
      if (!item || !item.text || !item.t) continue;
      const key = `${item.t}|${item.text}`;
      if (seen.has(key)) continue;
      seen.add(key);
      stats.candidates++;
      const ci = chunkIndexAt(rows, parseTs(item.t));
      if (ci < 0) { stats.miss++; continue; }
      const range = findHighlightRange(rows[ci].text, item.text);
      if (!range) { stats.miss++; continue; }
      stats[range.method]++;
      const rec = { range, pri, length: range.end - range.start };
      const prev = best.get(ci);
      if (!prev || rec.pri > prev.pri || (rec.pri === prev.pri && rec.length > prev.length)) best.set(ci, rec);
    }
  };
  add(e.quotes, 3);
  add(e.excerpts, 2);
  add(e.keyChunks, 1);
  stats.applied = best.size;
  window.__HKT_HL__ = stats;
  return best;
}
function transcriptSectionTitle(text){
  const t = String(text || '').replace(/^[嗯呃哦啊诶唉哎、，。！？\s]+/, '');
  return firstSentence(t, 22) || '逐字稿';
}
function buildTranscriptSections(e, rows, dlT){
  const N = rows.length;
  if (!N) return { sections: [], dlIdx: -1, dlSection: -1, mode: 'empty' };
  const chapters = (e.chapters || [])
    .filter(c => c && /\d/.test(String(c.t || '')))
    .map(c => ({ title: c.text || '', t: c.t, sec: parseTs(c.t), idx: chunkIndexAt(rows, parseTs(c.t)) }))
    .map(c => ({ ...c, idx: Math.max(0, Math.min(N - 1, c.idx)) }));
  const lastSec = rows[N-1].sec;
  const maxChapterSec = chapters.reduce((m, c) => Math.max(m, c.sec), 0);
  const trailerLike = !!e.trailer || N < 8 || (chapters.length > 0 && chapters.length < 2) || (chapters.length > 0 && maxChapterSec > lastSec + 600);
  let sections = [];
  let chapterNo = 1;
  if (trailerLike){
    sections.push({
      k: e.trailer ? '预告' : (chapters.length ? '全篇' : '逐字稿'),
      title: e.trailer ? '先听一段预告' : '完整逐字稿',
      rows: rows.map(r => r.idx),
      start: rows[0].t,
      end: rows[N-1].t,
      pseudo: true,
      open: true
    });
  } else if (!chapters.length){
    const size = 10;
    for (let i = 0; i < N; i += size){
      const group = rows.slice(i, i + size);
      sections.push({
        k: `小节 ${pad(sections.length + 1)}`,
        title: transcriptSectionTitle(group[0].text),
        rows: group.map(r => r.idx),
        start: group[0].t,
        end: group[group.length - 1].t,
        pseudo: true
      });
    }
  } else {
    const marks = [];
    const seenIdx = new Set();
    for (const c of chapters){
      if (seenIdx.has(c.idx)) continue;
      seenIdx.add(c.idx);
      marks.push(c);
    }
    marks.sort((a, b) => a.idx - b.idx);
    if (marks[0].idx > 0){
      sections.push({
        k: '开场',
        title: '节目开场',
        rows: rows.slice(0, marks[0].idx).map(r => r.idx),
        start: rows[0].t,
        end: rows[marks[0].idx - 1].t,
        pseudo: true
      });
    }
    marks.forEach((m, mi) => {
      const end = mi + 1 < marks.length ? marks[mi+1].idx : N;
      if (end <= m.idx) return;
      sections.push({
        k: `章节 ${pad(chapterNo++)}`,
        title: m.title || transcriptSectionTitle(rows[m.idx].text),
        rows: rows.slice(m.idx, end).map(r => r.idx),
        start: m.t,
        end: rows[end-1].t
      });
    });
  }
  if (!sections.length){
    sections.push({ k: '逐字稿', title: '完整逐字稿', rows: rows.map(r => r.idx), start: rows[0].t, end: rows[N-1].t, pseudo: true, open: true });
  }
  const dlIdx = dlT ? chunkIndexAt(rows, parseTs(dlT)) : -1;
  let dlSection = -1;
  if (dlIdx >= 0) sections.forEach((s, si) => { if (s.rows.includes(dlIdx)) dlSection = si; });
  sections.forEach((s, si) => { s.open = si === 0 || si === dlSection; });
  return { sections, dlIdx, dlSection, mode: trailerLike ? 'trailer' : (chapters.length ? 'chapters' : 'grouped') };
}

  return esc(src.slice(0, range.start)) + '<mark class="hl">' + esc(src.slice(range.start, range.end)) + '</mark>' + esc(src.slice(range.end));
}
